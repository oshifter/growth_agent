<template>
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:sparkles" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small">Growth Agent &mdash; Today</span>
                    </h2>
                </div>
            </header>
            <template if:true={hasRows}>
                <div class="slds-no-flex">
                    <span class="slds-badge">{count}</span>
                </div>
            </template>
        </div>
        <div class="slds-card__body">
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-vertical_large">
                    <lightning-spinner alternative-text="Loading" size="small" variant="brand"></lightning-spinner>
                </div>
            </template>

            <template if:true={hasError}>
                <div class="slds-p-horizontal_medium slds-p-vertical_small">
                    <div class="slds-scoped-notification slds-media slds-media_center slds-theme_error" role="alert">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:error" size="small" variant="inverse"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p>Can't read the Growth Agent &ndash; Today list view. Check that it exists and you have access.</p>
                        </div>
                    </div>
                </div>
            </template>

            <template if:true={isEmpty}>
                <div class="slds-align_absolute-center slds-p-vertical_large slds-text-align_center">
                    <div>
                        <h3 class="slds-text-heading_small">Queue clear</h3>
                        <p class="slds-text-body_small slds-text-color_weak">
                            Nothing due today. The agent runs again tonight.
                        </p>
                    </div>
                </div>
            </template>

            <template if:true={hasRows}>
                <p class="slds-text-heading_medium slds-p-horizontal_medium slds-p-bottom_x-small">
                    {headline}
                </p>
                <template for:each={rows} for:item="r">
                    <button key={r.id} class="qrow" data-id={r.id} onclick={handleOpen}>
                        <span class="qrow__rank">{r.rank}</span>
                        <span class="qrow__body">
                            <span class="qrow__name">{r.name}</span>
                            <span class="qrow__meta">{r.company} &middot; score {r.score}</span>
                            <span class="qrow__why">{r.whyNow}</span>
                        </span>
                        <span class={r.statusClass}>{r.status}</span>
                    </button>
                </template>
            </template>
        </div>
    </article>
</template>
