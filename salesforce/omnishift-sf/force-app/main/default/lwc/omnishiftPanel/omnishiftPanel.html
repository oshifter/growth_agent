<template>
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:sparkles" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small">Growth Agent</span>
                    </h2>
                </div>
            </header>
            <template if:true={isScored}>
                <div class="slds-no-flex">
                    <span class="slds-text-body_small slds-text-color_weak">
                        Scored {scoredOn}
                    </span>
                </div>
            </template>
        </div>

        <div class="slds-card__body slds-card__body_inner slds-p-bottom_medium">

            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-vertical_large">
                    <lightning-spinner alternative-text="Loading" size="small" variant="brand"></lightning-spinner>
                </div>
            </template>

            <template if:true={hasError}>
                <div class="slds-scoped-notification slds-media slds-media_center slds-theme_error" role="alert">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="utility:error" size="small" variant="inverse"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <p>Can't read Growth Agent fields on this record. Check field-level security.</p>
                    </div>
                </div>
            </template>

            <template if:true={notScored}>
                <div class="slds-align_absolute-center slds-p-vertical_large slds-text-align_center">
                    <div>
                        <h3 class="slds-text-heading_small slds-m-bottom_xx-small">Not on today's list</h3>
                        <p class="slds-text-body_small slds-text-color_weak">
                            Growth Agent didn't surface this record in the last run.
                            It'll be reconsidered tonight.
                        </p>
                    </div>
                </div>
            </template>

            <template if:true={isScored}>
                <!-- rank + score -->
                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                    <span class="slds-badge slds-badge_inverse slds-m-right_x-small">Rank {rank}</span>
                    <span class="slds-text-body_small slds-text-color_weak">
                        Score {score} &middot; run {runId}
                    </span>
                    <template if:true={inQueue}>
                        <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small">
                            &middot; {queuePosition}
                        </span>
                    </template>
                </div>

                <!-- why now -->
                <p class="slds-text-title_caps slds-m-bottom_xx-small">Why now</p>
                <p class="slds-text-body_regular slds-m-bottom_medium">{whyNow}</p>

                <!-- assignment + timing -->
                <div class="slds-box slds-box_x-small slds-m-bottom_medium">
                    <p class="slds-text-body_small">
                        <span class="slds-text-color_weak">Best fit:</span> <strong>{recommendedOwner}</strong>
                    </p>
                    <p class="slds-text-body_small slds-text-color_weak">
                        Recommended action date: {nextActionDate}
                    </p>
                </div>

                <!-- compliance -->
                <div class={complianceTheme} style="border-radius:.25rem;padding:.5rem .75rem;margin-bottom:.75rem">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name={complianceIcon} size="x-small" variant="inverse"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p class="slds-text-body_small">Compliance: {complianceStatus}</p>
                            <template if:true={complianceReason}>
                                <p class="slds-text-body_small">{complianceReason}</p>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- draft -->
                <template if:true={draftSubject}>
                    <lightning-button
                        label={draftButtonLabel}
                        variant="neutral"
                        onclick={toggleDraft}
                        class="slds-m-bottom_x-small"
                    ></lightning-button>
                    <template if:true={showDraft}>
                        <div class="slds-box slds-box_xx-small slds-m-bottom_medium">

                            <!-- reading -->
                            <template if:false={isEditing}>
                                <p class="slds-text-body_small slds-m-bottom_xx-small">
                                    <strong>{workingSubject}</strong>
                                </p>
                                <lightning-formatted-text value={workingBody}></lightning-formatted-text>
                            </template>

                            <!-- editing -->
                            <template if:true={isEditing}>
                                <lightning-input
                                    label="Subject"
                                    value={workingSubject}
                                    data-field="subject"
                                    onchange={handleDraftChange}
                                    class="slds-m-bottom_x-small"
                                ></lightning-input>
                                <lightning-textarea
                                    label="Message"
                                    value={workingBody}
                                    data-field="body"
                                    onchange={handleDraftChange}
                                ></lightning-textarea>
                                <div class="slds-m-top_x-small">
                                    <lightning-button
                                        label="Save draft"
                                        variant="brand"
                                        disabled={isSaving}
                                        onclick={handleSaveDraft}
                                        class="slds-m-right_xx-small"
                                    ></lightning-button>
                                    <lightning-button
                                        label="Cancel"
                                        onclick={handleCancelEdit}
                                    ></lightning-button>
                                </div>
                            </template>

                            <template if:false={isEditing}>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                                    {sendModeNote}
                                </p>
                            </template>
                        </div>
                    </template>
                </template>

                <!-- last disposition -->
                <template if:true={hasDisposition}>
                    <div class="slds-box slds-box_xx-small slds-m-bottom_small">
                        <p class="slds-text-body_small">
                            Last recorded: <strong>{lastDisposition}</strong>
                        </p>
                        <template if:true={dispositionReason}>
                            <p class="slds-text-body_small slds-text-color_weak">{dispositionReason}</p>
                        </template>
                    </div>
                </template>
            </template>
        </div>

        <template if:true={isScored}>
            <footer class="slds-card__footer">
                <template if:true={showSnooze}>
                    <div class="snooze slds-m-bottom_small">
                        <p class="slds-text-title_caps slds-m-bottom_xx-small">Come back to this</p>
                        <lightning-combobox
                            label="When"
                            value={snoozeChoice}
                            options={snoozeOptions}
                            onchange={handleSnoozeChoice}
                        ></lightning-combobox>
                        <template if:true={snoozeIsCustom}>
                            <lightning-input
                                type="date"
                                label="Date"
                                min={todayIso}
                                value={snoozeCustomIso}
                                onchange={handleSnoozeDate}
                                class="slds-m-top_x-small"
                            ></lightning-input>
                            <template if:true={snoozeIsPast}>
                                <p class="slds-text-body_small slds-text-color_error slds-m-top_xx-small" role="alert">
                                    That date has passed. Pick today or later.
                                </p>
                            </template>
                        </template>
                        <div class="slds-m-top_x-small">
                            <lightning-button
                                label={snoozeConfirmLabel}
                                variant="brand"
                                disabled={snoozeConfirmDisabled}
                                onclick={handleConfirmSnooze}
                                class="slds-m-right_xx-small"
                            ></lightning-button>
                            <lightning-button
                                label="Cancel"
                                onclick={handleCancelSnooze}
                            ></lightning-button>
                        </div>
                    </div>
                </template>

                <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
                    <template for:each={actions} for:item="a">
                        <lightning-button
                            key={a.key}
                            label={a.label}
                            variant={a.variant}
                            disabled={a.disabled}
                            data-disposition={a.key}
                            onclick={handleDisposition}
                            class="slds-m-right_xx-small slds-m-bottom_xx-small"
                        ></lightning-button>
                    </template>
                </div>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                    Approve and send checks compliance again before anything leaves. Every button logs what happened and sets the next action date.
                </p>

                <template if:true={inQueue}>
                    <div class="queue-nav slds-m-top_small">
                        <template if:true={hasNext}>
                            <lightning-button
                                label={nextLabel}
                                variant={nextVariant}
                                icon-name="utility:chevronright"
                                icon-position="right"
                                onclick={handleNext}
                            ></lightning-button>
                            <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small">
                                Goes straight to the next person, without going back to the queue.
                            </span>
                        </template>
                        <template if:true={atQueueEnd}>
                            <span class="slds-text-body_small slds-text-color_weak slds-m-right_x-small">
                                Last one on today's list.
                            </span>
                            <lightning-button
                                label="Back to today's queue"
                                variant={nextVariant}
                                onclick={handleBackToQueue}
                            ></lightning-button>
                        </template>
                    </div>
                </template>
            </footer>
        </template>
    </article>
</template>
